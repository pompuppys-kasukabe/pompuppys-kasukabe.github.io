<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram画像URLテスト</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    .test-section {
      margin-bottom: 40px;
      padding: 20px;
      border: 2px solid #e0e0e0;
      border-radius: 4px;
    }
    .test-section h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #555;
    }
    .test-section p {
      font-size: 14px;
      color: #666;
      margin-bottom: 15px;
    }
    .url-display {
      background: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      margin-bottom: 15px;
      color: #333;
    }
    .test-image {
      max-width: 100%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📸 Instagram画像URL表示テスト</h1>
    <p style="color: #666; margin-bottom: 30px;">
      規則的に生成した画像URLが &lt;img&gt; タグで表示できるかテストします。
    </p>

    <!-- テスト1: /media/?size=l（規則的なURL） -->
    <div class="test-section">
      <h2>テスト1: 規則的なURL（/media/?size=l）</h2>
      <p>投稿URLから規則的に生成した画像URL</p>
      <div class="url-display" id="url1"></div>
      <img
        id="test1"
        class="test-image"
        alt="テスト画像1"
      >
      <div id="status1" class="status loading">読み込み中...</div>
    </div>

    <!-- テスト2: 別の投稿 -->
    <div class="test-section">
      <h2>テスト2: 別の投稿でテスト</h2>
      <p>2つ目の投稿で同じ規則が適用できるか確認</p>
      <div class="url-display" id="url2"></div>
      <img
        id="test2"
        class="test-image"
        alt="テスト画像2"
      >
      <div id="status2" class="status loading">読み込み中...</div>
    </div>

    <!-- テスト3: 3つ目の投稿 -->
    <div class="test-section">
      <h2>テスト3: 3つ目の投稿でテスト</h2>
      <p>3つ目の投稿で同じ規則が適用できるか確認</p>
      <div class="url-display" id="url3"></div>
      <img
        id="test3"
        class="test-image"
        alt="テスト画像3"
      >
      <div id="status3" class="status loading">読み込み中...</div>
    </div>
  </div>

  <script>
    // NotionのInstagram URLから画像URLを生成
    const testUrls = [
      'https://www.instagram.com/pompuppysbright/p/DS_owBOEi__/',
      'https://www.instagram.com/pompuppysbright/p/DSm_vJkErsN/',
      'https://www.instagram.com/pompuppysbright/p/DTFfaJEEi_5/'
    ];

    testUrls.forEach((url, index) => {
      const testNumber = index + 1;
      const img = document.getElementById('test' + testNumber);
      const status = document.getElementById('status' + testNumber);
      const urlDisplay = document.getElementById('url' + testNumber);

      // 規則的に画像URLを生成
      const imageUrl = url + 'media/?size=l';
      urlDisplay.textContent = imageUrl;

      // 画像を読み込み
      img.src = imageUrl;

      // 読み込み成功
      img.onload = function() {
        status.textContent = '✅ 成功: 画像が表示されました';
        status.className = 'status success';
      };

      // 読み込み失敗
      img.onerror = function() {
        status.textContent = '❌ 失敗: 画像を読み込めませんでした（CORS制限またはURL無効）';
        status.className = 'status error';
      };
    });
  </script>
</body>
</html>
