<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>企画書 ─ POM PUPPYS bright 世界大会出場プロジェクト</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#1a1a1a;font-family:'Noto Sans JP',sans-serif;color:#fff;}
.header{
  position:sticky;top:0;z-index:10;
  background:rgba(26,26,26,.95);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.header-title{font-size:13px;font-weight:700;letter-spacing:1px;}
.header-sub{font-size:11px;color:#888;margin-top:2px;}
.header-back{
  color:#c8a84e;text-decoration:none;font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:6px;letter-spacing:1px;
}
.header-back:hover{color:#e0c87a;}
.pages{max-width:960px;margin:0 auto;padding:24px 24px 60px;}
.pages img{
  width:100%;display:block;border-radius:4px;
  margin-bottom:16px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
}
.page-num{
  text-align:center;font-size:11px;color:#555;
  margin:-8px 0 24px;letter-spacing:2px;
  font-family:'Poppins',sans-serif;
}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="header-title">世界大会出場プロジェクト 企画書</div>
    <div class="header-sub">POM PUPPYS bright</div>
  </div>
  <a class="header-back" href="./index.html"><span>&larr;</span> 資料一覧に戻る</a>
</div>
<div class="pages">
  <img src="./proposal-pages/page-1.jpg" alt="Page 1"><div class="page-num">1 / 7</div>
  <img src="./proposal-pages/page-2.jpg" alt="Page 2"><div class="page-num">2 / 7</div>
  <img src="./proposal-pages/page-3.jpg" alt="Page 3"><div class="page-num">3 / 7</div>
  <img src="./proposal-pages/page-4.jpg" alt="Page 4"><div class="page-num">4 / 7</div>
  <img src="./proposal-pages/page-5.jpg" alt="Page 5"><div class="page-num">5 / 7</div>
  <img src="./proposal-pages/page-6.jpg" alt="Page 6"><div class="page-num">6 / 7</div>
  <img src="./proposal-pages/page-7.jpg" alt="Page 7"><div class="page-num">7 / 7</div>
</div>
</body>
</html>
